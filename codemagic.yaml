# Secrets are NOT stored in this file.
# Create in Codemagic UI (Team settings → Code signing identities → Android keystores):
#   - Android keystore reference "Deportes La Sport"
#
# android/ is not committed (Expo Continuous Native Generation): it is generated by `expo prebuild`,
# which also applies the config plugins in app.json:
#   - plugins/withCodemagicSigning.js  → signs release builds with the keystore above
#   - expo-build-properties            → R8 minify/shrink (native code obfuscation, mapping.txt)
# JS obfuscation of the app's own code runs in metro.config.js when ENABLE_JS_OBFUSCATION=true.
workflows:
  react-native-android:
    name: Deportes La Sport Android
    max_build_duration: 90
    instance_type: mac_mini_m2
    environment:
      android_signing:
        - Deportes La Sport
      vars:
        PACKAGE_NAME: "com.dddeportessslasporttt"
        ENABLE_JS_OBFUSCATION: "true"
      node: 22
      java: 17
    scripts:
      - name: Install npm dependencies
        script: |
          # .npmrc sets legacy-peer-deps, matching how package-lock.json was generated.
          # --include=dev: javascript-obfuscator (used by metro.config.js) is a devDependency.
          npm ci --include=dev
      - name: Generate native Android project
        script: |
          npx expo prebuild --platform android --clean --no-install
      - name: Set Android SDK location
        script: |
          echo "sdk.dir=$ANDROID_SDK_ROOT" > "$CM_BUILD_DIR/android/local.properties"
      - name: Build Android release (AAB + APK)
        script: |
          cd android
          ./gradlew bundleRelease assembleRelease
    artifacts:
      - android/app/build/outputs/**/*.aab
      - android/app/build/outputs/**/*.apk
      - android/app/build/outputs/**/mapping.txt
